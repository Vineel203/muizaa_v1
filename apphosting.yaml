# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

# Root level — NOT under runConfig (required for socket mount)
cloudSqlInstances:
  - muizaa:asia-south1:muizaa-instance

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production

  - variable: DATABASE_URL
    secret: DATABASE_URL

  - variable: SESSION_SECRET
    secret: SESSION_SECRET

  - variable: CLOUD_SQL_INSTANCE
    value: muizaa:asia-south1:muizaa-instance

  # Uses @google-cloud/cloud-sql-connector (works without Unix socket mount)
  - variable: CLOUD_SQL_USE_CONNECTOR
    value: "true"

  - variable: DB_SSL
    value: "false"
