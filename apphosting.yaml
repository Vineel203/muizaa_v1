# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  # REQUIRED for Cloud SQL from App Hosting (Cloud Run).
  # Find in: Google Cloud Console → SQL → your instance → Connection name
  # Example: muizaa:us-east4:muizaa-database
  cloudSqlInstances:
    - muizaa:asia-south1:muizaa-instance

env:
  - variable: NODE_ENV
    value: production

  - variable: DATABASE_URL
    secret: DATABASE_URL

  - variable: SESSION_SECRET
    secret: SESSION_SECRET

  # Must exactly match cloudSqlInstances above
  - variable: CLOUD_SQL_INSTANCE
    value: muizaa:asia-south1:muizaa-instance

  - variable: DB_SSL
    value: "false"
