# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production

  - variable: DATABASE_URL
    secret: DATABASE_URL

  - variable: SESSION_SECRET
    secret: SESSION_SECRET

  # Set to "true" only if your PostgreSQL instance requires SSL
  - variable: DB_SSL
    value: "false"
