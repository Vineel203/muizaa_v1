# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

# Root level — NOT under runConfig (required for socket mount)
cloudSqlInstances:
  - muizaa:asia-south1:muizaa-instance

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 20
  memoryMiB: 2048
  cpu: 2

# Keep bundled Chromium runtime libraries in the deploy output
outputFiles:
  serverApp:
    include: [., node_modules, vendor, templates, views, public]

env:
  - variable: NODE_ENV
    value: production

  - variable: DATABASE_URL
    secret: DATABASE_URL

  - variable: SESSION_SECRET
    secret: SESSION_SECRET

  - variable: CLOUD_SQL_INSTANCE
    value: muizaa:asia-south1:muizaa-instance

  # Uses @google-cloud/cloud-sql-connector (works without Unix socket mount)
  - variable: CLOUD_SQL_USE_CONNECTOR
    value: "true"

  - variable: DB_SSL
    value: "false"

  # GDM PDF storage — create secrets before deploy (see README / deployment notes)
  - variable: GOOGLE_DRIVE_ROOT_FOLDER_ID
    secret: GOOGLE_DRIVE_ROOT_FOLDER_ID

  - variable: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
    secret: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
